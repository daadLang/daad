name: test-and-release
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - "main.go"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"   # keep in sync with go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Validate release config (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}   # PAT/App token that can bypass the ruleset

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - run: npm ci || npm install

      - name: Semantic Release
        id: semantic
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          npx semantic-release

          git fetch --tags
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "BEFORE: $BEFORE"
          echo "AFTER: $AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${AFTER#v}" >> $GITHUB_OUTPUT
            echo "new_release_git_head=$(git rev-list -n 1 $AFTER)" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}   # used by @semantic-release/git to push

      - name: Fetch new tags
        if: steps.semantic.outputs.new_release_published == 'true'
        run: git fetch --tags origin

      - name: Check out the release commit
        if: steps.semantic.outputs.new_release_published == 'true'
        run: git checkout ${{ steps.semantic.outputs.new_release_git_head }}

      - name: GoReleaser
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}